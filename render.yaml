services:
  - type: web
    name: arabic-cbt-smp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: arabic-cbt-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/arabic-cbt.sqlite
